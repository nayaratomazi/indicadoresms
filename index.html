<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Indicadores, SIGTAP, CID e CIAP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --primary: #2b6cb0;
            --secondary: #3182ce;
            --bg: #edf2f7;
            --text: #2d3748;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        
        * { box-sizing: border-box; font-family: 'Inter', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* --- Estilos da Tela (Ocultos na Impressão) --- */
        .no-print {
            background-color: var(--card-bg); padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        h1 { color: var(--primary); font-size: 24px; margin-top: 0; text-align: center; font-weight: 700; }
        p.subtitle { text-align: center; color: #718096; font-size: 14px; margin-bottom: 25px; margin-top: -10px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568; font-size: 14px; }
        select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px;
            font-size: 15px; background-color: #fff; color: #2d3748;
            transition: border-color 0.2s;
        }
        select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.2); }
        
        .button-group { display: flex; gap: 10px; margin-top: 30px; }
        button {
            flex: 1; padding: 14px; background-color: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:hover { background-color: var(--secondary); transform: translateY(-1px); }
        .btn-print { background-color: #38a169; display: none; }
        .btn-print:hover { background-color: #2f855a; }

        /* --- Estilos da Área de Exibição na Tela --- */
        #print-area { display: none; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .checklist-header { border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .checklist-title { font-size: 20px; color: var(--primary); margin: 0 0 10px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        .checklist-meta { font-size: 14px; color: #4a5568; margin-top: 5px; background: #f7fafc; padding: 5px 10px; border-radius: 4px; display: inline-block; margin: 2px;}
        
        .checklist-item { margin-bottom: 15px; display: flex; align-items: flex-start; padding: 12px; background: #fbfbfc; border-radius: 8px; border: 1px solid #edf2f7; }
        .checkbox-box {
            width: 20px; height: 20px; border: 2px solid #a0aec0; border-radius: 4px;
            margin-right: 12px; flex-shrink: 0; margin-top: 2px; background: white;
        }
        .item-content { flex-grow: 1; }
        .item-desc { font-size: 15px; line-height: 1.4; color: #2d3748; font-weight: 600; display: block; margin-bottom: 6px; }
        
        .sigtap-codes {
            background-color: #ebf4ff; padding: 8px 10px; border-radius: 6px; font-size: 13px;
            color: #2c5282; border-left: 3px solid var(--secondary); line-height: 1.5;
        }

        /* --- Estilos Guia de Códigos CID/CIAP --- */
        .codigos-guia { margin-top: 30px; border-top: 2px dashed #cbd5e0; padding-top: 20px; }
        .codigos-title { font-size: 16px; color: #276749; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; text-align: center;}
        .codigos-box {
            background-color: #f0fff4; border-left: 4px solid #38a169; border-radius: 6px;
            padding: 12px; margin-bottom: 15px;
        }
        .codigos-box h4 { margin: 0 0 8px 0; color: #22543d; font-size: 14px; border-bottom: 1px solid #c6f6d5; padding-bottom: 4px; }
        .codigos-content { font-size: 12px; color: #2d3748; line-height: 1.5; column-count: 2; column-gap: 20px; }
        .codigos-content strong { color: #276749; }

        /* --- ESTILOS EXCLUSIVOS PARA IMPRESSÃO (Ficha Compacta) --- */
        @media print {
            @page { margin: 5mm; } 
            body { background-color: white; padding: 0; }
            .no-print { display: none !important; }
            
            #print-area { 
                display: block !important; border: 1px dashed #718096; padding: 10px; 
                max-width: 11cm; margin: 0 auto; box-shadow: none;
            }
            
            .checklist-header { border-bottom: 1px solid #cbd5e0; padding-bottom: 6px; margin-bottom: 8px; text-align: left; }
            .checklist-title { font-size: 10pt; margin: 0 0 3px 0; color: #000; letter-spacing: 0; }
            .checklist-meta { font-size: 7pt; color: #000; background: none; padding: 0; margin: 1px 0; display: block; }
            
            .checklist-item { margin-bottom: 6px; padding: 0; background: transparent; border: none; align-items: flex-start;}
            .checkbox-box { width: 10px; height: 10px; border: 1px solid #000; border-radius: 2px; margin-right: 6px; margin-top: 2px; }
            .item-desc { font-size: 7.5pt; line-height: 1.1; color: #000; margin-bottom: 2px; font-weight: 700; }
            .sigtap-codes { background-color: transparent; padding: 2px 0 2px 6px; margin-top: 1px; border-left: 1px dashed #718096; font-size: 6pt; color: #333; border-radius: 0; }
            
            /* Impressão dos CIDs/CIAPs */
            .codigos-guia { margin-top: 10px; padding-top: 5px; border-top: 1px solid #cbd5e0; }
            .codigos-title { font-size: 8pt; margin-bottom: 5px; color: #000; text-align: left;}
            .codigos-box { padding: 4px; margin-bottom: 5px; background: transparent; border-left: 1px solid #000; border-radius: 0; }
            .codigos-box h4 { font-size: 7pt; margin: 0 0 3px 0; color: #000; border-bottom: 1px dotted #000; }
            .codigos-content { font-size: 6pt; column-count: 2; column-gap: 10px; line-height: 1.1; }
        }
    </style>
</head>

    function atualizarFormulario() {
        const sexo = document.getElementById("sexo").value;
        const selIdade = document.getElementById("idade");
        const selCond = document.getElementById("condicao");
        
        document.getElementById("div-idade").style.display = sexo ? "block" : "none";
        document.getElementById("div-condicao").style.display = sexo ? "block" : "none";
        document.getElementById("btn-gerar").style.display = sexo ? "flex" : "none";
        document.getElementById("btn-imprimir").style.display = "none";
        document.getElementById("print-area").style.display = "none";

        selIdade.innerHTML = '';
        selCond.innerHTML = '';

        if (sexo === 'M') {
            faixasMasculinas.forEach(f => selIdade.add(new Option(f.label, f.value)));
            selCond.add(new Option("Nenhuma Condição", "nenhuma"));
            selCond.add(new Option("Hipertensão", "hipertensao"));
            selCond.add(new Option("Diabetes", "diabetes"));
            selCond.add(new Option("Hipertensão e Diabetes", "ambas"));
        } else if (sexo === 'F') {
            faixasFemininas.forEach(f => selIdade.add(new Option(f.label, f.value)));
            selCond.add(new Option("Nenhuma Condição", "nenhuma"));
            selCond.add(new Option("Hipertensão", "hipertensao"));
            selCond.add(new Option("Diabetes", "diabetes"));
            selCond.add(new Option("Hipertensão e Diabetes", "ambas"));
            
            selIdade.onchange = function() {
                const idadeVal = selIdade.value;
                const hasGestante = Array.from(selCond.options).some(opt => opt.value === 'gestante');
                const canBeGestante = ['9a14', '15a23', '24a49', '50a59'].includes(idadeVal);
                
                if (canBeGestante && !hasGestante) {
                    selCond.add(new Option("Gestante", "gestante"));
                } else if (!canBeGestante && hasGestante) {
                    for(let i=0; i<selCond.length; i++){
                        if(selCond.options[i].value == 'gestante'){
                            selCond.remove(i); break;
                        }
                    }
                }
            };
            selIdade.onchange(); 
        }
    }

    function formatarItemComSigtap(texto) {
        let sigtapHtml = "";
        if (texto.includes("peso e altura")) sigtapHtml += "<div><strong>SIGTAP (Antropo):</strong> 01.01.04.002-4, 007-5, 008-3</div>";
        if (texto.includes("pressão arterial")) sigtapHtml += "<div><strong>SIGTAP (PA):</strong> 03.01.10.003-9</div>";
        if (texto.includes("1a consulta presencial") && texto.includes("30o dia")) sigtapHtml += "<div><strong>SIGTAP (Pueri):</strong> 03.01.01.026-9, 027-7</div>";
        else if (texto.includes("até 2 anos") && texto.includes("consultas")) sigtapHtml += "<div><strong>SIGTAP (Pueri):</strong> 03.01.01.026-9, 027-7, 025-0</div>";
        else if (texto.includes("1ª consulta") && texto.includes("12ª semana")) sigtapHtml += "<div><strong>SIGTAP (Pré-Natal):</strong> 03.01.01.011-0, 003-0, 006-4</div>";
        else if (texto.includes("durante a gestação") && texto.includes("consultas")) sigtapHtml += "<div><strong>SIGTAP (Gestante):</strong> 03.01.01.011-0, 003-0, 006-4</div>";
        else if (texto.includes("puerpério") && texto.includes("consulta")) sigtapHtml += "<div><strong>SIGTAP (Puerpério):</strong> 03.01.01.012-9</div>";
        else if (texto.includes("nos últimos 6 meses") && texto.includes("consulta")) sigtapHtml += "<div><strong>SIGTAP:</strong> 03.01.01.003-0, 006-4</div>";
        
        if (texto.includes("visitas domiciliares") || texto.includes("visita domiciliar")) sigtapHtml += "<div><strong>SIGTAP (VD):</strong> 03.01.01.013-7</div>";
        if (texto.includes("avaliação dos pés")) sigtapHtml += "<div><strong>SIGTAP:</strong> 03.01.04.009-5</div>";
        if (texto.includes("hemoglobina glicada")) sigtapHtml += "<div><strong>SIGTAP:</strong> 02.02.01.050-3, ABEX008</div>";
        if (texto.includes("colo de útero")) sigtapHtml += "<div><strong>SIGTAP:</strong> 02.01.02.003-3, 02.03.01.008-6</div>";
        if (texto.includes("câncer de mama")) sigtapHtml += "<div><strong>SIGTAP:</strong> 02.04.03.003-0</div>";

        if (sigtapHtml !== "") {
            return `<span class="item-desc">${texto}</span><div class="sigtap-codes">${sigtapHtml}</div>`;
        }
        return `<span class="item-desc">${texto}</span>`;
    }

            adicionouCodigo = true;
        }
        
        // Verifica Saúde da Mulher (Preventivo, Mama, Sexualidade)
        const faixasMulher = ['9a14', '15a23', '24a49', '50a59', '60a64', '65a69'];
        if (sexo === 'F' && faixasMulher.includes(idade)) {
            codigosHtml += `<div class="codigos-box">${dbCodigos.saude_mulher}</div>`;
            adicionouCodigo = true;
        }

        codigosHtml += `</div>`;
        
        if(adicionouCodigo) {
            containerCodigos.innerHTML = codigosHtml;
            containerCodigos.style.display = "block";
        } else {
            containerCodigos.style.display = "none";
            containerCodigos.innerHTML = "";
        }

        document.getElementById("print-area").style.display = "block";
        document.getElementById("btn-imprimir").style.display = "flex";
    }
</script>
</body>
</html>
